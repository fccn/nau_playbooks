# Playbook that (re)applies the iptables firewall configuration to NAU servers.
#
# All firewall data lives in secure-nau-data, per group, as a `<group_name>_firewall_ports` list:
#
#   xtradb_servers_firewall_ports:
#     - port: "{{ xtradb_mysql_port }}"
#       comment: "XtraDB MySQL client port"
#       allowed_ips: []                          # falls back to nau_network
#     - port: "{{ xtradb_galera_sst_port }}"
#       comment: "XtraDB Galera SST"
#       allowed_ips: "{{ xtradb_servers_ips }}"   # own cluster peers only
#
# Each entry's source resolves to its own allowed_ips/allowed_network, else the shared
# nau_network, else the rule is dropped (denied, not opened). An entry may set `interface: eth1`
# to restrict it to one interface.
#
# A group with no `_firewall_ports` defined gets a single default rule: open to nau_network. This
# matches current unrestricted access, so access is only tightened when a service opts in.
#
# `firewall_target` (comma-separated string, `-e firewall_target=a,b`) is the only way to select
# hosts; omit it for a no-op. `firewall_managed_groups` is a static, checked-in list of onboarded
# groups, used only to validate `firewall_target` and to warn about groups missing from it.
# `firewall_leaf_meta_groups` lists structural groups (e.g. kubernetes_servers) whose children are
# targeted instead, so they're skipped by both checks.
#
# Management/bastion groups (jump_servers, command_and_control) must always define explicit
# `_firewall_ports` and never rely on the nau_network default, since they aren't part of the
# internal service mesh.
#
# Two plays: the first validates firewall_target against firewall_managed_groups on localhost
# (so it fails fast even if firewall_target selects zero real hosts); the second applies the rules.
#
# Example:
#   ansible-playbook -i nau-data/envs/<env>/hosts.ini firewall.yml -e firewall_target=balancer_servers --check --diff
#
---
- name: Fail fast if firewall_target requests a group that isn't in firewall_managed_groups
  hosts: "{{ ['localhost'] if ((firewall_target | default('')).split(',') | map('trim') | reject('equalto', '') | list | length > 0) else [] }}"
  become: false
  gather_facts: false
  tags: firewall
  tasks:
    - name: Fail if any requested firewall_target group is not in firewall_managed_groups
      assert:
        that: "item in (firewall_managed_groups | default([]))"
        fail_msg: >-
          '{{ item }}' was requested via `firewall_target` but is not listed in
          firewall_managed_groups (not yet onboarded/reviewed for this playbook).
      loop: "{{ (firewall_target | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
      run_once: true
      tags: firewall

- name: Apply firewall configuration to NAU servers
  hosts: "{{ (firewall_target | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
  become: True
  gather_facts: True
  tags: firewall
  tasks:
    - name: Warn if the shared nau_network fallback variable is not defined
      debug:
        msg: >-
          nau_network is not defined. Any firewall port entry or group default-access rule relying
          on it as a fallback will be dropped, denying that traffic (ansible-firewall ends in a
          default DROP). Define nau_network, or explicit per-entry allowed_ips/allowed_network, in
          secure-nau-data.
      when: nau_network is not defined
      tags: firewall

    - name: Warn if any inventory group is missing from firewall_managed_groups
      debug:
        msg: >-
          These groups exist in inventory but are not listed in firewall_managed_groups, so they
          will never be targeted by this playbook even if explicitly requested via `firewall_target`:
          {{ groups.keys() | difference(firewall_leaf_meta_groups | default([])) | difference(firewall_managed_groups | default([])) }}
      when: (groups.keys() | difference(firewall_leaf_meta_groups | default([])) | difference(firewall_managed_groups | default([])) | length) > 0
      run_once: true
      tags: firewall

    - name: Collect each group's firewall port entries this host belongs to
      # Excludes firewall_leaf_meta_groups: a host in e.g. redis_docker_servers is also, via
      # inventory's `:children`, a member of the meta group observability_docker_servers. Without
      # this exclusion, that meta group's own (always undefined) `_firewall_ports` would be
      # collected too, and the next task would then treat it as "no ports defined", emitting an
      # extra default-access-to-nau_network rule that silently reopens whatever port(s)
      # redis_docker_servers_firewall_ports had otherwise restricted.
      set_fact:
        firewall_group_port_lists: "{{ firewall_group_port_lists | default([]) + [{'name': item, 'ports': lookup('vars', item ~ '_firewall_ports', default=[])}] }}"
      loop: "{{ group_names | difference(firewall_leaf_meta_groups | default([])) }}"
      loop_control:
        label: "{{ item }}"
      tags: firewall

    - name: Build a firewall rule for every explicitly defined firewall port entry
      set_fact:
        firewall_servers_rules: >-
          {{
            firewall_servers_rules | default([])
            + (
                (resolved_port_source != '')
                | ternary(
                    [
                      '-A INPUT'
                      ~ (' -i ' ~ item.1.interface if (item.1.interface is defined and item.1.interface) else '')
                      ~ ' -s ' ~ resolved_port_source ~ ' -p tcp -m tcp --dport ' ~ item.1.port
                      ~ ' -m state --state NEW -j ACCEPT -m comment --comment "' ~ item.1.comment ~ '"'
                    ],
                    []
                  )
              )
          }}
      vars:
        # Combines this entry's own allowed_ips (list) and allowed_network (CIDR) if either is
        # defined, otherwise falls back to the shared nau_network, otherwise resolves to ''.
        resolved_port_source: >-
          {{
            (
              (item.1.allowed_ips | default([]))
              + ([item.1.allowed_network] if (item.1.allowed_network is defined and item.1.allowed_network) else [])
            )
            | join(',')
            or (nau_network | default(''))
          }}
      loop: "{{ firewall_group_port_lists | subelements('ports', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.name }}:{{ item.1.port }}"
      tags: firewall

    - name: Build a default access rule for groups without any firewall port entries defined
      set_fact:
        firewall_servers_rules: >-
          {{
            firewall_servers_rules | default([])
            + (
                (item.ports | length == 0 and (nau_network | default('')) != '')
                | ternary(
                    [
                      '-A INPUT -s ' ~ (nau_network | default('')) ~ ' -p tcp -m state --state NEW -j ACCEPT'
                      ~ ' -m comment --comment "' ~ item.name ~ ' (default access, no port-specific rules defined)"'
                    ],
                    []
                  )
              )
          }}
      loop: "{{ firewall_group_port_lists }}"
      tags: firewall

    - name: Apply firewall role with aggregated rules
      include_role:
        name: ansible-firewall
      tags: firewall
