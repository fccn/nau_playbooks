# Playbook that checks the health of the whole platform.
#
# 1. The checks below only read and never change anything:
# - vips: each keepalived virtual IP is held by exactly one node and that node is its MASTER
# - kubernetes: rke2, API server, etcd quorum, nodes Ready, pods, workloads and volumes
# - connectivity: every Kubernetes worker reaches MongoDB, XtraDB, Redis, Elasticsearch,
#   ClickHouse, the Richie MySQL and Ceph S3
# - docker-services: the Makefile healthcheck of the load balancers and the registry mirror
# - host: the OS, the IPv4 addresses against the inventory, the routes (default route, container networks
#   that overlap the host's) and the iptables rules (loaded against the persisted file). It also lists the
#   OS, addresses and firewall of every host in the report.
# - endpoints: the public endpoints of the platform through each load balancer VIP, the DNS
#   answer of the public names and the TLS certificates
#
# 2. The report lists every problem found by step 1. It is printed before step 3, so it is
#    shown even if step 3 stops the playbook.
#
# 3. On every server: the Makefile `healthcheck` of each service, the URL checks and the
#    routing to the load balancer virtual IPs. This is the same check that gates the deploy
#    and rolling playbooks. It has the `vm` tag and stops the playbook at the first failing host.
#
# 4. The playbook fails if step 1 found any problem.
#
# Ansible playbook extra variables:
# - target_mysql_server - used to check only a subrange of MySQL databases for its health
# - target_mongo_server - used to change the default Mongo database instance where to check the health of the cluster
# - healthcheck_retries and healthcheck_delay - retries of the Makefile healthcheck of step 3 (50 retries, 30 seconds)
# - healthcheck_vip_expected_holder_enforced=false - while a node is in maintenance, do not require the VIPs on their MASTER
# - healthcheck_endpoints_check_ipv6=true - also test the IPv6 VIPs
# All the variables of the new checks are documented in group_vars/all/healthcheck.yml.
#
# Examples:
#   ansible-playbook -i nau-data/envs/development/hosts.ini healthcheck.yml
#
# Only some of the new checks, skipping step 3:
#   ansible-playbook -i nau-data/envs/production/hosts.ini healthcheck.yml --tags vips,kubernetes,always --skip-tags vm
#
# Only step 3, as before this upgrade:
#   ansible-playbook -i nau-data/envs/production/hosts.ini healthcheck.yml --tags vm
#
# With --limit only the hosts in the limit are checked, and a virtual IP is only verified when all
# the hosts that declare it are in the limit. The endpoints checks run on localhost, add it to the
# limit to run them, for example --limit 'lb01,localhost'.
#
---
- name: Check the virtual IPs are on the correct servers
  hosts: all
  gather_facts: false
  tags: vips
  tasks:
    - import_tasks: tasks/healthcheck_vips.yml

- name: Check the Kubernetes clusters
  hosts: kubernetes_control_plane_servers
  gather_facts: false
  tags: kubernetes
  tasks:
    - import_tasks: tasks/healthcheck_kubernetes.yml

- name: Check the Kubernetes workers reach the data stores
  hosts: kubernetes_worker_node_servers
  gather_facts: false
  tags: connectivity
  tasks:
    - import_tasks: tasks/healthcheck_connectivity.yml

- name: Check the load balancers and the registry mirror
  hosts: balancer_servers:registry_mirror_server
  gather_facts: false
  tags: docker-services
  tasks:
    - import_tasks: tasks/healthcheck_docker_services.yml

- name: Check the operating system, the network and the firewall of each host
  hosts: all
  become: true
  gather_facts: false
  tags: host
  tasks:
    - import_tasks: tasks/healthcheck_host.yml

- name: Check the public endpoints through each load balancer
  hosts: localhost
  connection: local
  gather_facts: false
  tags: endpoints
  tasks:
    - import_tasks: tasks/healthcheck_endpoints.yml

- name: Report the problems found
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: List the problems of every host
      ansible.builtin.set_fact:
        healthcheck_report: >-
          {{ (groups['all'] + ['localhost']) | unique
             | map('extract', hostvars, 'healthcheck_problems') | select('defined') | flatten | unique | sort }}
      run_once: true

    - name: Print the operating system, addresses and firewall of each host
      ansible.builtin.debug:
        msg: "{{ infos }}"
      vars:
        infos: "{{ groups['all'] | map('extract', hostvars, 'healthcheck_host_info') | select('defined') | sort | list }}"
      when: infos | length > 0 and healthcheck_host_show_info | bool
      run_once: true

    - name: Print the problems
      ansible.builtin.debug:
        msg: "{{ healthcheck_report if healthcheck_report | length > 0 else 'No problem found' }}"
      run_once: true

- name: Run Health check
  hosts: all
  tags: vm
  become: True
  gather_facts: True
  serial: "{{ serial_number | default(1) }}" # default check in parallel
  tasks:
    - import_tasks: tasks/healthcheck.yml

    - import_role:
        name: nau_check_urls

    - name: Check routing if can connect to 1st load balancer virtual IP
      shell: |
        curl -4 -v --resolve {{ EDXAPP_LMS_BASE }}:443:{{ hostvars[groups['balancer_servers'][0]].balancer_virtual_ipv4_1 }} https://{{ EDXAPP_LMS_BASE }}
      # Executing a curl doesn't change anything, so we have better output
      changed_when: False
      when: hostvars[groups['balancer_servers'][0]].balancer_virtual_ipv4_1 is defined

    - name: Check routing if can connect to 2nd load balancer virtual IP
      shell: |
        curl -4 -v --resolve {{ EDXAPP_LMS_BASE }}:443:{{ hostvars[groups['balancer_servers'][0]].balancer_virtual_ipv4_2 }} https://{{ EDXAPP_LMS_BASE }}
      # Executing a curl doesn't change anything, so we have better output
      changed_when: False
      when: hostvars[groups['balancer_servers'][0]].balancer_virtual_ipv4_2 is defined

- name: Fail if any check found a problem
  hosts: all
  gather_facts: false
  tags: always
  tasks:
    - name: Fail if there is any problem
      ansible.builtin.fail:
        msg: "{{ healthcheck_report | length }} problem(s) found, see the report above"
      when: healthcheck_report | length > 0
      run_once: true
