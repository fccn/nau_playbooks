---
xtradb_docker_image: docker.io/percona/percona-xtradb-cluster:8.0.36
xtradb_cluster_name: pxc-cluster1
xtradb_node_name: "{{ inventory_hostname }}"

# By default when we deploy we won't initialize a new cluster.
xtradb_cluster_initialization: false

xtradb_mysql_port: 3306
xtradb_ports:
- "{{ xtradb_mysql_port }}" # 3306 is used for MySQL client connections and SST (State Snapshot Transfer) via mysqldump.
- 4444 # 4444 is used for SST via rsync and Percona XtraBackup.
- 4567 # 4567 is used for write-set replication traffic (over TCP) and multicast replication (over TCP and UDP).
- 4568 # 4568 is used for IST (Incremental State Transfer).

xtradb_docker_container_name: xtradb

xtradb_docker_deploy_base_folder: "/nau/ops/{{ xtradb_docker_container_name }}"
xtradb_docker_deploy_compose_template: templates/docker-compose.yml.j2

xtradb_docker_deploy_healthcheck_retries: 120
xtradb_docker_deploy_healthcheck_delay: 10

# Files to be templated during deployment
xtradb_docker_deploy_templates:
  - src: templates/Makefile
    dest: "{{ xtradb_docker_deploy_base_folder }}/Makefile"
  - src:  templates/custom.cnf
    dest: "{{ docker_deploy_base_folder }}/custom.cnf"
    config_name: xtradb_cnf
    service: xtradb
    docker_target: /etc/percona-xtradb-cluster.conf.d/custom.cnf

xtradb_mysql_docker_volume_path: /data/{{ xtradb_docker_container_name }}/

xtradb_certs_folder: "{{ xtradb_docker_deploy_base_folder }}/certs"
xtradb_docker_certs_folder: /cert

xtradb_docker_deploy_files:
- src: "{{ xtradb_certs_ca_key }}"
  dest: "{{ xtradb_certs_folder }}/ca-key.pem"
  service: xtradb
  secret_name: xtradb_certs_ca_key
  docker_target: "{{ xtradb_docker_certs_folder }}/ca.pem"
- src: "{{ xtradb_certs_ca }}"
  dest: "{{ xtradb_certs_folder }}/ca.pem"
  service: xtradb
  secret_name: xtradb_certs_ca
  docker_target: "{{ xtradb_docker_certs_folder }}/ca.pem"
- src: "{{ xtradb_certs_client_cert }}"
  dest: "{{ xtradb_certs_folder }}/client-cert.pem"
  service: xtradb
  secret_name: xtradb_certs_client_cert
  docker_target: "{{ xtradb_docker_certs_folder }}/client-cert.pem"
- src: "{{ xtradb_certs_client }}"
  dest: "{{ xtradb_certs_folder }}/client-key.pem"
  service: xtradb
  secret_name: xtradb_certs_client-key
  docker_target: "{{ xtradb_docker_certs_folder }}/client-key.pem"
- src: "{{ xtradb_certs_private_key }}"
  dest: "{{ xtradb_certs_folder }}/private_key.pem"
  service: xtradb
  secret_name: xtradb_certs_private_key
  docker_target: "{{ xtradb_docker_certs_folder }}/private_key.pem"
- src: "{{ xtradb_certs_public_key }}"
  dest: "{{ xtradb_certs_folder }}/public_key.pem"
  service: xtradb
  secret_name: xtradb_certs_public_key
  docker_target: "{{ xtradb_docker_certs_folder }}/public_key.pem"
- src: "{{ xtradb_certs_server_cert }}"
  dest: "{{ xtradb_certs_folder }}/server-cert.pem"
  service: xtradb
  secret_name: xtradb_certs_server_cert
  docker_target: "{{ xtradb_docker_certs_folder }}/server-cert.pem"
- src: "{{ xtradb_certs_server_key }}"
  dest: "{{ xtradb_certs_folder }}/server-key.pem"
  service: xtradb
  secret_name: xtradb_certs_server_key
  docker_target: "{{ xtradb_docker_certs_folder }}/server-key.pem"

xtradb_docker_user_id: 1001
xtradb_docker_group_id: 1001

xtradb_docker_deploy_folders_additional:
  - dest: "{{ xtradb_mysql_docker_volume_path }}"
    dir_owner: "{{ xtradb_docker_user_id }}"
    dir_group: "{{ xtradb_docker_group_id }}"
    dir_mode: "755"

xtradb_docker_environment_variables: "{{ xtradb_docker_environment_variables_default | combine(xtradb_docker_environment_variables_default_join if not xtradb_cluster_initialization else {}) | combine(xtradb_docker_environment_variables_overrides, recursive=True) }}"
xtradb_docker_environment_variables_overrides: {}
xtradb_docker_environment_variables_default:
  TZ: "{{ xtradb_timezone | default('Europe/Lisbon') }}"
  MYSQL_ROOT_PASSWORD: "{{ xtradb_mysql_root_password }}"
  CLUSTER_NAME: "{{ xtradb_cluster_name }}"

# CLUSTER_JOIN is not present when deploying the 1st node at 1st time
xtradb_docker_environment_variables_default_join:
  CLUSTER_JOIN: "{{ xtradb_cluster_hosts | join(',') }}"

xtradb_docker_max_connections: 1000
xtradb_docker_innodb_buffer_pool_size: 5934M
# xtradb_docker_thread_cache_size: 20

# Prefer the last node in the cluster to be used for state transfer from the cluster.
# If the list contains a trailing comma, the remaining nodes in the cluster
# will also be considered if the nodes from the list are not available.
xtradb_docker_wsrep_sst_donor: "{{ xtradb_cluster_hosts[-1] }},"

# Engine settings (nau-technical#1100). Nothing below is set by default: when a variable is not defined, the setting
# is not written to custom.cnf and the image / MySQL default applies, so the role changes nothing until an
# environment opts in (in secure-nau-data). Measure first: `make xtradb-innodb-pressure`.
#
# Do not use SET PERSIST for any of them. It writes mysqld-auto.cnf in the data directory, which wins over
# custom.cnf at every restart and hides the value from this repository. Use SET GLOBAL for an immediate effect and
# set the same value here.

# Stop resolving the host name of every new client connection (the image keeps the host cache off, so each
# connection costs a reverse and a forward DNS lookup, nau-technical#722). Needs a restart. A MySQL account whose
# host is a host name (`app@db.example.com`, or a wildcard like `app@%.example.com`) stops matching, silently for
# a wildcard, so first run on every node: SELECT user, host FROM mysql.user WHERE host REGEXP '[A-Za-z]' AND host <> 'localhost';
# and enable it only if that returns nothing. IPv6 addresses (`::1`) are listed too, ignore those.
# xtradb_docker_skip_name_resolve: true

# Size of the InnoDB redo log (MySQL default 100M), 8M to 99G. It absorbs write bursts: writers wait when the redo that is not
# yet flushed to the data files reaches the capacity. It does not help when the writes are above what the disk can
# flush for a long time. The files are allocated in full in `/data` (2G uses 2G), a crash recovery after a kill
# replays at most that much redo, and mysqld can take longer to stop than Docker's 10 s default. Dynamic: SET GLOBAL
# innodb_redo_log_capacity = 2147483648. Always give a unit, a bare number is in bytes.
# xtradb_docker_innodb_redo_log_capacity: 2G

# Slow query log, to find the queries that are worth a change before guessing a limit. The files are written in the
# data directory (`/data/xtradb/slow.log.NNNNNN`), rotated by mysqld at `max_size` and only `max_files` are kept, so
# the disk used is bounded by max_size x max_files. Entries are about 400 bytes. Without a threshold above 0 every
# statement is logged, which is only for a short test. At runtime (no restart):
#   SET GLOBAL slow_query_log_file = '/var/lib/mysql/slow.log'; SET GLOBAL long_query_time = 1;
#   SET GLOBAL log_slow_extra = ON; SET GLOBAL max_slowlog_size = 268435456; SET GLOBAL max_slowlog_files = 4;
#   SET GLOBAL slow_query_log = ON;
# xtradb_docker_slow_query_log: true
xtradb_docker_slow_query_log_long_query_time: 1
xtradb_docker_slow_query_log_max_size: 256M
xtradb_docker_slow_query_log_max_files: 4

# Size of the Galera write-set cache (`galera.cache`, default 128M). It decides how long a node can be away and still
# rejoin by IST instead of a full SST from a donor. The file is allocated in full in `/data`. Needs a restart. Size it
# with `make xtradb-innodb-pressure` (the IST window it prints). Before enlarging it, check the kernel and the file
# system of the nodes: Percona PXC-5340 (open) reports write amplification on the memory mapped gcache with the
# large folio support of recent kernels (XFS since 5.18, ext4 since 6.16).
# xtradb_docker_gcache_size: 1G
