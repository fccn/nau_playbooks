---
# clickhouse_partner_access
#
# Provisions native, read-only, org-scoped ClickHouse access for external
# data partners (e.g. ARTE), per fccn/nau-technical#981 "Option A". Runs
# as part of deploy.yml's ClickHouse play (see README.md).

# Kill switch, independent of clickhouse_partners being non-empty -- must
# be explicitly set true per-environment (alongside clickhouse_partners)
# before anything is provisioned there. Keeps rollout a deliberate,
# reviewable one-line change per environment.
clickhouse_partner_access_enabled: false

# Whether this environment's ClickHouse is a replicated cluster (mirrors
# clickhouse_docker_deploy's own clustering logic). Dev is single-node
# and has no `logs_cluster` templated, so `ON CLUSTER` DDL would fail
# there -- override to false in dev's group_vars.
clickhouse_partner_access_on_cluster: true

# Name of the replicated cluster (see clickhouse_docker_deploy's
# macros). Only relevant when clickhouse_partner_access_on_cluster is true.
clickhouse_partner_access_cluster: logs_cluster

# User that owns partner-facing DEFINER views (must already have SELECT
# on the underlying tables the views read from).
clickhouse_partner_access_view_definer: ch_admin

# Category 1 tables (#981 Option A): already have a native `org` column
# and no PII, so ROW POLICY + GRANT SELECT is enough. Shared across all
# partners -- only the `org` literal differs per partner.
clickhouse_partner_access_org_scoped_tables:
  - xapi.enrollment_events
  - xapi.grading_events
  - xapi.problem_events
  - xapi.navigation_events
  - xapi.video_playback_events
  - xapi.responses
  - xapi.xapi_events_all_parsed
  - event_sink.course_blocks
  - event_sink.course_overviews
  - reporting.dim_most_recent_enrollment
  - reporting.fact_enrollment_status
  - reporting.dim_learner_most_recent_course_grade
  - reporting.dim_subsection_problem_results
  - reporting.dim_problem_results
  - reporting.dim_problem_responses
  - reporting.dim_learner_last_response
  - reporting.fact_video_segments
# reporting.int_problem_results is NOT in this list despite having an
# `org` column -- see README's "Why some org-scoped tables still need a
# DEFINER view" section.

# Explicit column list for reporting.<partner>_problem_attempts (see
# templates/partner_access.sql.j2) -- deliberately not `SELECT *`, so a
# future column added upstream to int_problem_results (e.g. PII) isn't
# silently exposed to every partner. Matches int_problem_results' full
# column list as of #981; update here (not the template) if that
# changes.
clickhouse_partner_access_problem_attempts_columns:
  - emission_time
  - org
  - course_key
  - course_name
  - course_run
  - problem_id
  - problem_name
  - problem_name_with_location
  - course_order
  - problem_link
  - actor_id
  - responses
  - success
  - attempts
  - interaction_type
  - graded

# event_sink.user_profile columns exposed through each partner's DEFINER
# view (see templates/partner_access.sql.j2). meta_json_fields are
# extracted out of the opaque `meta` JSON blob -- never expose `meta`
# itself.
clickhouse_partner_access_profile_direct_fields:
  - year_of_birth
  - gender
  - level_of_education
  - country
clickhouse_partner_access_profile_meta_json_fields:
  - nif
  - employment_situation
  - nuts
  - cae4

# Partner list -- empty by default. Real per-environment values (org
# codes/passwords) live in secure-nau-data's group_vars, e.g.:
#
# clickhouse_partners:
#   - name: arte
#     orgs: ["AMA", "portugaldigital"]
#     password: "{{ clickhouse_partner_arte_password }}"
#
# `orgs` is a list, not a single org string -- a partner's courses can
# span more than one platform `org` namespace (ARTE's do: both `AMA`
# and `portugaldigital`, confirmed live against
# xapi.enrollment_events -- each has its own real, substantial
# enrollment volume, not just a handful of stray rows).
#
# `name` becomes org_user_<name>/org_role_<name>/reporting.<name>_user_profile/
# reporting.<name>_problem_attempts.
clickhouse_partners: []

# Shared resource-governance profile + quota applied to every partner
# role (see templates/partner_resource_limits.sql.j2), bounding
# worst-case per-query cost and per-hour query volume so a partner
# can't impact core LMS/CMS ClickHouse load -- even via a single heavy
# query that the row policy doesn't make any cheaper. One shared
# profile/quota for all partners (not per-partner): the governance
# policy is uniform by design.
#
# Values derived from a scalability/performance-impact analysis (prod
# hardware facts + a synthetic load test confirming real enforcement)
# done as part of fccn/nau-technical#981 -- see
# roles/clickhouse_partner_access/docs/resource_governance_analysis.md
# for the full analysis. Summary:
# - max_memory_usage matches Trino's own existing per-node cap
#   (query.max-memory-per-node=2GB) for the same partner access --
#   this is the per-QUERY cap, enforced regardless of how a session
#   reached ClickHouse (Trino or a direct connection).
# - max_memory_usage_for_user/max_concurrent_queries_for_user add a
#   per-USER ceiling on top: Trino's own 5-concurrent-query cap for
#   ARTE only constrains queries routed through Trino. A session
#   connecting to ClickHouse directly as org_user_<partner> (native or
#   HTTP port) isn't bound by that -- without a per-user cap here, nothing
#   stops 20+ parallel direct connections each using up to
#   max_memory_usage, i.e. up to 40GB against a 28.2GiB prod server
#   limit. max_memory_usage_for_user=10GB is that same 5 x 2GB budget,
#   confirmed live it's enforced as a genuine per-user AGGREGATE across
#   however many concurrent queries that user has open (ClickHouse's own
#   error is literally "User memory limit exceeded", distinct from and
#   independent of the per-query max_memory_usage error) -- so raising
#   max_concurrent_queries_for_user doesn't by itself widen how much
#   memory one partner can use at once; that's still bounded here.
#   max_concurrent_queries_for_user=40 (not Trino's raw concurrency
#   figure of 5) accounts for a real, measured multiplier: inspecting
#   dev's actual system.query_log for traffic from Trino's ClickHouse
#   JDBC connector (the real clickhouse_partners catalog path, not a
#   synthetic test) showed every single logical Trino-level query
#   against this catalog issuing ~6-8 ClickHouse statements, not 1 --
#   JDBC metadata-discovery calls (currentUser, table/column listing)
#   around the actual data query. 5 (Trino's concurrency cap) x 8
#   (measured, rounded up for margin) = 40. These metadata calls are
#   also near-instant (confirmed live, <30ms each) -- they don't
#   meaningfully consume execution-time budget, only query *count*.
# - max_threads=4 derives from prod's 16 cores per ClickHouse node
#   divided by Trino's existing 5-concurrent-query cap for ARTE.
# - max_bytes_to_read=25GB stops an outsized scan on bytes read, not
#   just memory/time: the synthetic 50M-row test read 30.15 GiB before
#   the memory cap killed it at 17s -- this cuts off a similarly
#   shaped but less memory-hungry query earlier, while still leaving
#   ~2x headroom over the 12.06 GiB a legitimate heavy (20M-row) query
#   actually read in that same test.
# - max_execution_time=60s gives ~3.5x margin over the measured cost
#   of a deliberately heavy query in the synthetic test, far under
#   Trino's own 10-15min ceiling.
# - quota_max_queries=1600 applies that same ~8x measured multiplier to
#   the original "~200 real Trino-level queries/hour" target -- a quota
#   this role already counts every individual ClickHouse statement
#   against (metadata lookups included), so a 200/hour cap sized for
#   logical queries would throttle legitimate usage almost entirely via
#   JDBC overhead, not real query volume.
# - quota_max_execution_time is unaffected by the above: the metadata
#   overhead is negligible in duration (confirmed live), so it doesn't
#   meaningfully eat into the execution-time budget the way it does the
#   query-count budget.
# - The quota's 1-hour interval reuses the convention already used by
#   ClickHouse's own (otherwise unconstrained) `default` quota.
clickhouse_partner_access_settings_profile: partner_readonly
clickhouse_partner_access_max_memory_usage: 2000000000 # 2GB, per query
clickhouse_partner_access_max_execution_time: 60 # seconds
clickhouse_partner_access_max_threads: 4
clickhouse_partner_access_max_bytes_to_read: 25000000000 # 25GB, per query
clickhouse_partner_access_max_memory_usage_for_user: 10000000000 # 10GB, i.e. 5 x max_memory_usage
clickhouse_partner_access_max_concurrent_queries_for_user: 40 # 5 (Trino's concurrency cap) x ~8 (measured ClickHouse statements per Trino-level query)

clickhouse_partner_access_quota_name: partner_quota
clickhouse_partner_access_quota_interval_hours: 1
clickhouse_partner_access_quota_max_queries: 1600 # 200 (target real queries/hour) x ~8 (measured ClickHouse statements per Trino-level query)
clickhouse_partner_access_quota_max_execution_time: 1200 # seconds, summed across the interval
