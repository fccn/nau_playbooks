---
mongo_docker_instance_name: mongo

# To initialize define these two variables with non empty values
mongo_docker_initdb_root_username: ''
mongo_docker_initdb_root_password: ''

# default MongoDB port
mongo_docker_port: 27017

mongo_docker_image: docker.io/mongo:4.2.24
# Older releases:
# docker.io/mongo:4.2.24
# docker.io/mongo:4.0.28
# docker.io/mongo:3.6.23

# From >= 6.0 use mongosh
mongo_shell_command: mongo
# mongo_shell_command: mongosh

mongo_docker_command: "{{ mongo_docker_command_keyfile }}--replSet {{ mongo_docker_replSet }} --port {{ mongo_docker_port }} {{ mongo_docker_command_bind_ip }}{{ ' --maxConns ' ~ mongo_docker_max_conns if (mongo_docker_max_conns | int > 0) else '' }}"
mongo_docker_command_bind_ip: --bind_ip {{ (mongo_docker_command_bind_ip_default_list + mongo_docker_command_bind_ip_additional_list) | select() | join(',') }}
mongo_docker_command_bind_ip_default_list:
  - localhost
  - "{{ mongo_docker_container_name }}"
  - "{{ ansible_host }}"
mongo_docker_command_bind_ip_additional_list: []
mongo_docker_command_keyfile: "{{ '--keyFile ' + mongo_docker_keyfile_path + ' ' if (mongo_docker_keyFile_value | length > 0) else '' }}"
mongo_docker_keyfile_path: /run/secrets/mongodb_key

mongo_docker_deploy_parent_folder: /nau/ops
mongo_docker_deploy_base_folder: "{{ mongo_docker_deploy_parent_folder }}/{{ mongo_docker_instance_name }}"
mongo_docker_deploy_compose_template: templates/docker-compose.yml.j2

mongo_docker_container_name: "{{ mongo_docker_deploy_base_folder | basename }}"
mongo_docker_deploy_healthcheck_delay: 5
mongo_docker_deploy_healthcheck_retries: 50

# Files to be templated during deployment
mongo_docker_deploy_templates:
  - src_data: "{{ mongo_docker_initdb_root_username }}"
    dest: "{{ mongo_docker_deploy_base_folder }}/mongo/mongo-root-username"
    secret_name: mongo_root_username
    service: mongo
    docker_target: "{{ mongo_docker_secret_root_username_file_path }}"
    when: "{{ mongo_docker_initdb_root_username | length > 0 }}"
  - src_data: "{{ mongo_docker_initdb_root_password }}"
    dest: "{{ mongo_docker_deploy_base_folder }}/mongo/mongo-root-password"
    secret_name: mongo_root_password
    service: mongo
    docker_target: "{{ mongo_docker_secret_root_password_file_path }}"
    when: "{{ mongo_docker_initdb_root_password | length > 0 }}"
  - src_data: "{{ mongo_docker_keyFile_value }}"
    dest: "{{ mongo_docker_deploy_base_folder }}/mongo/mongodb_key"
    mode: "0600"
    owner: 999
    secret_name: mongo_key
    service: mongo
    docker_target: "{{ mongo_docker_keyfile_path }}"
    when: "{{ mongo_docker_keyFile_value | length > 0 }}"
  - src: templates/Makefile
    dest: "{{ mongo_docker_deploy_base_folder }}/Makefile"

# File path where the docker secrets are stored inside the mongo docker container
mongo_docker_secret_root_username_file_path: "{{ '/run/secrets/mongo-root-username' if ( mongo_docker_initdb_root_username | length > 0 ) else '' }}"
mongo_docker_secret_root_password_file_path: "{{ '/run/secrets/mongo-root-password' if ( mongo_docker_initdb_root_password | length > 0 ) else '' }}"

mongo_docker_volume_path: /data/{{ mongo_docker_instance_name }}

mongo_docker_deploy_extra_hosts: []

mongo_limit_no_file_soft: 65535
mongo_limit_no_file_hard: 65535
mongo_limit_nproc: 65535

# Thread limit (cgroup pids.max) of the mongod container. mongod uses one thread per client connection.
# Without an explicit value the container inherits the systemd DefaultTasksMax of the VM (9374 on the
# PROD VMs, which was reached on 2026-11-11 and refused new connections, see fccn/nau-technical#1132).
# Always use a positive number: `pids_limit: -1` (and 0) leave the inherited limit in place, both with
# Docker Compose v2.32 (the version on the PROD VMs) and v5. Each thread also costs memory (about 0.2 MB
# measured), so raise it together with the VM RAM.
#
# Sizing (measured on 2026-11-12): each LMS pod (UWSGI_WORKERS=32) holds about 1,825 connections to Mongo,
# about 600 per Mongo node. 20 LMS pods (the HPA cap) are about 12k per node, plus the workers and the CMS.
# The primary carries about 1.9k more, and a failover puts about 1.5x on the surviving nodes, so the
# realistic peak is about 20k. Recompute both values if the pod cap or UWSGI_WORKERS change.
mongo_limit_pids: 32768

# Maximum number of client connections accepted by mongod (--maxConns), 0 disables it.
# With it mongod refuses the connections above the limit cleanly (it logs "Connection refused because there
# are too many open connections") instead of failing to create threads, and it keeps threads for its own
# replication and election work. mongod uses about 70 threads beyond the connections, so keep it at least
# 1000 below mongo_limit_pids (checked by the role).
mongo_docker_max_conns: 28000
