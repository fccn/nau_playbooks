---
# Checks the variables of the deploy before anything changes. The play of deploy.yml runs this file before Docker is
# installed; main.yml runs it again, so that the role is safe on its own.
# The regexes end in \Z, not $: $ would also accept a value that ends in a newline.

# The two tokens are never printed: their checks only produce booleans.
- name: Check the tokens (their values are never printed)
  set_fact:
    mcp_grafana_token_valid: >-
      {{ sa_read_grafana_token is defined
         and ( sa_read_grafana_token | string ) is match('^[A-Za-z0-9_.~+/=-]{20,200}\Z') }}
    mcp_agent_token_valid: >-
      {{ mcp_agent_token is defined
         and ( mcp_agent_token | string ) is match('^[A-Za-z0-9_.~+/=-]{32,200}\Z') }}
  no_log: true

- name: Validate the MCP deploy configuration
  assert:
    that:
      - mcp_grafana_url is defined
      - ( mcp_grafana_url | string ) is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?/?\Z')
      - ( mcp_port | string ) is match('^[0-9]+\Z') and ( mcp_port | int ) >= 1024 and ( mcp_port | int ) <= 65535
      - ( mcp_docker_image | string ) is match('^[A-Za-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}\Z')
      - mcp_grafana_token_valid | bool
      - mcp_agent_token_valid | bool
    fail_msg: >-
      Define in secure-nau-data (group_vars/mcp_servers.yml): mcp_grafana_url (https://, the Grafana of this environment),
      sa_read_grafana_token (the token of a Viewer service account) and mcp_agent_token (32 characters or more).
      mcp_port, when set, is a port from 1024 to 65535, and mcp_docker_image keeps its digest (image:tag@sha256:...).
      The tokens are never printed.
    quiet: true
