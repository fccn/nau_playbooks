---
- name: Check if the exporter folder already exists
  stat:
    path: "{{ node_exporter_docker_deploy_base_folder }}"
  register: node_exporter_folder
  check_mode: false # read only

- name: Create the exporter folder
  file:
    path: "{{ node_exporter_docker_deploy_base_folder }}"
    state: directory
    mode: "0755"

# The docker deploy role runs shell commands inside the folder, which does not exist yet in check mode.
- name: Report that the exporter container would be deployed
  debug:
    msg: "Check mode: the exporter container would be deployed after the folder {{ node_exporter_docker_deploy_base_folder }} is created."
  when: ansible_check_mode and not node_exporter_folder.stat.exists

- name: Deploy the node exporter container
  include_role:
    name: ansible-docker-deploy
  vars:
    docker_deploy_base_folder:      "{{ node_exporter_docker_deploy_base_folder }}"
    docker_deploy_compose_template: "{{ node_exporter_docker_deploy_compose_template }}"
    docker_deploy_templates:        "{{ node_exporter_docker_deploy_templates }}"
    docker_deploy_shell: true
    # No docker healthcheck, see the compose template.
    docker_deploy_healthcheck: false
  when: not ansible_check_mode or node_exporter_folder.stat.exists
  tags:
    - docker_deploy

- name: Wait until the node exporter answers
  uri:
    url: "http://{{ node_exporter_listen_ip | default('127.0.0.1', true) }}:{{ node_exporter_listen_port }}/metrics"
    return_content: true
  register: node_exporter_metrics
  until: node_exporter_metrics.content | default('') is search('(?m)^node_uname_info')
  retries: "{{ node_exporter_healthcheck_retries }}"
  delay: "{{ node_exporter_healthcheck_delay }}"
  when: not ansible_check_mode
  changed_when: false
  tags:
    - healthcheck
    - docker_deploy
