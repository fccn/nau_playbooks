---
- name: Install make
  package:
    name: make
    state: present
  tags:
    - docker_deploy

- name: Deploy
  include_role:
    name: ansible-docker-deploy
  vars:
    docker_deploy_base_folder:         "{{ redis_docker_deploy_base_folder }}"
    docker_deploy_compose_template:    "{{ redis_docker_deploy_compose_template }}"
    docker_deploy_templates:           "{{ redis_docker_deploy_templates | default([]) }}"
    docker_deploy_files:               "{{ redis_docker_deploy_files | default([]) }}"
    docker_deploy_folders_additional:  "{{ redis_docker_deploy_folders_additional | default([]) }}"
    docker_deploy_configs:             "{{ redis_docker_deploy_configs | default([]) }}"
    docker_deploy_secrets:             "{{ redis_docker_deploy_secrets | default([]) }}"
    docker_deploy_services_additional: "{{ redis_docker_deploy_services_additional | default([]) }}"
    docker_deploy_healthcheck_delay :  "{{ redis_docker_deploy_healthcheck_delay }}"
    docker_deploy_healthcheck_retries: "{{ redis_docker_deploy_healthcheck_retries }}"
  tags:
    - docker_deploy

- name: Run healthcheck
  shell: make healthcheck
  args:
    chdir: "{{ redis_docker_deploy_base_folder }}"
  delay: "{{ redis_docker_deploy_healthcheck_delay }}"
  register: result
  until: result.rc == 0
  retries: "{{ redis_docker_deploy_healthcheck_retries }}"
  # run it only when deploying or when on healthcheck mode.
  changed_when: False
  when: not ansible_check_mode
  tags: 
    - healthcheck
    - docker_deploy

# nau-technical#799: a Redis server restart (this deploy included) can leave a
# stale keda-operator scaler connection stuck retrying as `default` even after
# it's disabled - keda-operator doesn't always reconnect its already-cached
# scalers with fresh credentials on its own. This is informational only (never
# fails the deploy) since fixing it requires deleting/recreating the affected
# ScaledObject in Kubernetes, a manual follow-up action.
- name: Check for stale unauthenticated (default) client connections
  shell: make check-unauthenticated-clients
  args:
    chdir: "{{ redis_docker_deploy_base_folder }}"
  register: _redis_stale_clients_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode and not (redis_default_user_enabled | default(true) | bool)
  tags:
    - healthcheck
    - docker_deploy

- name: Print stale unauthenticated client warning if any
  debug:
    msg: "{{ _redis_stale_clients_check.stdout_lines }}"
  when: _redis_stale_clients_check is defined and _redis_stale_clients_check.stdout is defined and 'WARNING' in _redis_stale_clients_check.stdout
  tags:
    - healthcheck
    - docker_deploy
