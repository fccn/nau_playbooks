---
- name: Install make
  package:
    name: make
    state: present
  tags:
    - docker_deploy

- name: Assert REDIS_PASSWORD only contains characters safe to interpolate unquoted
  assert:
    that:
      - REDIS_PASSWORD is defined
      - REDIS_PASSWORD is match('^[A-Za-z0-9]+$')
    fail_msg: >-
      REDIS_PASSWORD (set per-environment in secure-nau-data) must be
      alphanumeric only (letters and digits, no punctuation at all). It is
      interpolated unquoted/unescaped into
      roles/redis_docker_deploy/templates/redis.conf.j2 (Redis ACL config
      syntax has no quoting for the >password token), the Makefile healthcheck
      targets, and the docker-compose healthcheck's inline shell command.
      A space, '#' (Redis config comment marker), quote, backtick, '$',
      newline, or any other punctuation would silently break Redis config
      parsing or the healthcheck shell invocation, surfacing only in
      whichever environment happens to have picked an unsafe value.
  tags:
    - docker_deploy

- name: Deploy
  include_role:
    name: ansible-docker-deploy
  vars:
    docker_deploy_base_folder:         "{{ redis_docker_deploy_base_folder }}"
    docker_deploy_compose_template:    "{{ redis_docker_deploy_compose_template }}"
    docker_deploy_templates:           "{{ redis_docker_deploy_templates | default([]) }}"
    docker_deploy_files:               "{{ redis_docker_deploy_files | default([]) }}"
    docker_deploy_folders_additional:  "{{ redis_docker_deploy_folders_additional | default([]) }}"
    docker_deploy_configs:             "{{ redis_docker_deploy_configs | default([]) }}"
    docker_deploy_secrets:             "{{ redis_docker_deploy_secrets | default([]) }}"
    docker_deploy_services_additional: "{{ redis_docker_deploy_services_additional | default([]) }}"
    docker_deploy_shell: true
    docker_deploy_healthcheck_delay :  "{{ redis_docker_deploy_healthcheck_delay }}"
    docker_deploy_healthcheck_retries: "{{ redis_docker_deploy_healthcheck_retries }}"
  tags:
    - docker_deploy

- name: Run healthcheck
  shell: make healthcheck
  args:
    chdir: "{{ redis_docker_deploy_base_folder }}"
  delay: "{{ redis_docker_deploy_healthcheck_delay }}"
  register: result
  until: result.rc == 0
  retries: "{{ redis_docker_deploy_healthcheck_retries }}"
  # run it only when deploying or when on healthcheck mode.
  changed_when: False
  when: not ansible_check_mode
  tags: 
    - healthcheck
    - docker_deploy