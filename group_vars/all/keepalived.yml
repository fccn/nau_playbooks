---
# keepalived virtual IP (VIP) configuration
keepalived_vrrp_instances: "{{
  ( balancer_keepalived_vrrp_instances  | default([]) ) +
  ( redis_keepalived_vrrp_instances  | default([]) ) +
  ( elasticsearch_keepalived_vrrp_instances  | default([]) ) +
  ( richie_mysql_keepalived_vrrp_instances | default([]) ) +
  ( openedx_mysql_read_replica_keepalived_vrrp_instances | default([]) ) +
  ( xtradb_keepalived_vrrp_instances | default([]) ) +
  ( clickhouse_keepalived_vrrp_instances | default([]) ) +
  []
}}"

# Make the MASTER announce its VIPs again with gratuitous ARP, every minute and when a BACKUP that
# took a VIP gives it back. Without it, after a BACKUP held a VIP for a few seconds during a network
# problem, the clients that learned the BACKUP's MAC kept it (fccn/nau-technical#1142).
keepalived_global_defs:
  vrrp_garp_master_refresh: 60
  vrrp_garp_master_refresh_repeat: 2
  vrrp_garp_lower_prio_repeat: 5
  vrrp_higher_prio_send_advert: true

# Drop the traffic that reaches a node for a VIP held by another node, so a client that kept the
# old MAC gets no answer from the old node (Docker's NAT kept answering the connections it had
# open) and finds the holder. See the README of ansible-keepalived.
keepalived_vip_guard: true

keepalived_health: "{{
  ( balancer_keepalived_health | default([]) ) +
  ( redis_keepalived_health | default([]) ) +
  ( elasticsearch_keepalived_health | default([]) ) +
  ( richie_mysql_keepalived_health | default([]) ) +
  ( openedx_mysql_read_replica_keepalived_health | default([]) ) +
  ( xtradb_keepalived_health | default([]) ) +
  ( clickhouse_keepalived_health | default([]) ) +
  []
}}"
