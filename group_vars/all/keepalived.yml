---
# keepalived virtual IP (VIP) configuration
keepalived_vrrp_instances: "{{
  ( balancer_keepalived_vrrp_instances  | default([]) ) +
  ( redis_keepalived_vrrp_instances  | default([]) ) +
  ( elasticsearch_keepalived_vrrp_instances  | default([]) ) +
  ( richie_mysql_keepalived_vrrp_instances | default([]) ) +
  ( openedx_mysql_read_replica_keepalived_vrrp_instances | default([]) ) +
  ( xtradb_keepalived_vrrp_instances | default([]) ) +
  ( clickhouse_keepalived_vrrp_instances | default([]) ) +
  []
}}"

# Make the MASTER announce its VIPs again with gratuitous ARP when a BACKUP that took a VIP gives it
# back, and every minute. Without it, after the adverts were lost in both directions and a BACKUP
# held a VIP for a few seconds, the clients that learned the BACKUP's MAC kept it
# (fccn/nau-technical#1142). See the README of ansible-keepalived for what each option covers.
keepalived_global_defs:
  vrrp_higher_prio_send_advert: true
  vrrp_garp_master_refresh: 60
  vrrp_garp_master_refresh_repeat: 2

# Drop the traffic that reaches a node for a VIP held by another node, so a client that kept the
# old MAC gets no answer from the old node (Docker's NAT kept answering the connections it had
# open) and finds the holder. See the README of ansible-keepalived.
keepalived_vip_guard: true

keepalived_health: "{{
  ( balancer_keepalived_health | default([]) ) +
  ( redis_keepalived_health | default([]) ) +
  ( elasticsearch_keepalived_health | default([]) ) +
  ( richie_mysql_keepalived_health | default([]) ) +
  ( openedx_mysql_read_replica_keepalived_health | default([]) ) +
  ( xtradb_keepalived_health | default([]) ) +
  ( clickhouse_keepalived_health | default([]) ) +
  []
}}"

# VIPs checked by healthcheck.yml (tag keepalived_vips). For each VIP:
# - the hosts of `group` that hold it: exactly one, else it is down or in split brain;
# - on every other host of the same network, each ARP entry of the VIP must point to a MAC of a
#   physical interface of that holder;
# - on the hosts of `client_groups`, a TCP connection to the VIP and port must open.
# `vip_var` and `port_var` are read from the first host of `group`; `port` is used when `port_var` is not defined there.
# A VIP whose group is empty or whose `vip_var` is not defined in an environment is skipped; the run
# lists the VIPs it checked and skipped. Several checks can share a VIP.
keepalived_vip_checks:
  - name: Redis
    group: redis_docker_servers
    vip_var: redis_virtual_ipv4
    port_var: redis_docker_port
    port: 6379
    client_groups: [ kubernetes_worker_node_servers ]
  - name: XtraDB read-write
    group: xtradb_servers
    vip_var: xtradb_virtual_ipv4_rw
    port_var: xtradb_mysql_port
    port: 3306
    client_groups: [ kubernetes_worker_node_servers ]
  - name: XtraDB read
    group: xtradb_servers
    vip_var: xtradb_virtual_ipv4_r
    port_var: xtradb_mysql_port
    port: 3306
    client_groups: [ kubernetes_worker_node_servers ]
  - name: ClickHouse
    group: clickhouse_servers
    vip_var: clickhouse_virtual_ipv4
    port_var: clickhouse_server_tcp_port
    port: 9000
    client_groups: [ kubernetes_worker_node_servers ]
  - name: ClickHouse read
    group: clickhouse_servers
    vip_var: clickhouse_virtual_ipv4_r
    port_var: clickhouse_server_tcp_port
    port: 9000
    client_groups: [ kubernetes_worker_node_servers ]
  - name: Richie MySQL
    group: richie_mysql_docker_servers
    vip_var: richie_mysql_virtual_ipv4
    port_var: richie_mysql_docker_port
    port: 3306
    client_groups: [ kubernetes_worker_node_servers ]
  # The load balancer VIPs are public, so only their holder is checked; healthcheck.yml already curls them.
  - name: Load balancer 1
    group: balancer_servers
    vip_var: balancer_virtual_ipv4_1
    port: 443
    client_groups: []
  - name: Load balancer 2
    group: balancer_servers
    vip_var: balancer_virtual_ipv4_2
    port: 443
    client_groups: []

# Seconds to wait for each TCP connection of the VIP check.
keepalived_vip_connect_timeout: 3
