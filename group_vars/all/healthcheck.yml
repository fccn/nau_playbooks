---
# Variables of the `healthcheck.yml` playbook.
# This file is public, secrets must never be added here.

# Hostnames and ports of the platform come from the inventory (EDXAPP_LMS_BASE, marketing_site_nau_domain, ...).
# The Ecommerce and AP hostnames are not variables of the inventory, so they are derived from the domain of the
# marketing site: www.nau.edu.pt gives nau.edu.pt, www.stage.nau.fccn.pt gives stage.nau.fccn.pt.
healthcheck_public_domain: "{{ marketing_site_nau_domain | regex_replace('^www\\.', '') }}"

# ---------------------------------------------------------------------------
# Virtual IPs (keepalived)
# ---------------------------------------------------------------------------
# Also fail when a VIP is held by a node that is not its keepalived MASTER.
# Set to false while a node is intentionally in maintenance (keepalived priority lowered).
healthcheck_vip_expected_holder_enforced: true

# ---------------------------------------------------------------------------
# Kubernetes
# ---------------------------------------------------------------------------
healthcheck_k8s_kubectl: /var/lib/rancher/rke2/bin/kubectl
healthcheck_k8s_kubeconfig: /etc/rancher/rke2/rke2.yaml
healthcheck_k8s_etcd_tls_dir: /var/lib/rancher/rke2/server/tls/etcd
healthcheck_k8s_etcd_endpoint: https://127.0.0.1:2379
# etcd stops accepting writes when its database reaches the space quota (2 GiB by default).
healthcheck_k8s_etcd_max_db_size_bytes: 1717986918 # 1.6 GiB
# Namespaces ignored when looking for pods, workloads and volumes that are not ready.
healthcheck_k8s_ignore_namespaces: []
healthcheck_k8s_report_limit: 20

# ---------------------------------------------------------------------------
# Connectivity from the Kubernetes worker nodes to the data stores
# ---------------------------------------------------------------------------
healthcheck_connectivity_timeout: 5

# ---------------------------------------------------------------------------
# Public endpoints, tested through every load balancer VIP
# ---------------------------------------------------------------------------
healthcheck_endpoints_timeout: 30
healthcheck_endpoints_retries: 2
healthcheck_endpoints_delay: 10
# The retries only absorb a service that is warming up. Report an endpoint that needed them as a problem,
# otherwise a flapping backend behind a load balancer goes unnoticed.
healthcheck_endpoints_flaky_is_problem: true
# Also test the IPv6 VIPs. The machine that runs the playbook needs IPv6 connectivity.
healthcheck_endpoints_check_ipv6: false
# Every IPv4 VIP of the load balancers must be in the DNS answer of these names.
healthcheck_dns_check_enabled: true
healthcheck_tls_expiry_days: 14

# Each endpoint accepts:
#   name, host, path (default /), method (default GET), status (default 200),
#   content (substring of the response body),
#   json (list of {path: a.b, equals: value} checked on the JSON body, up to two levels).
healthcheck_endpoints:
  - name: LMS heartbeat (MongoDB, MySQL and Celery)
    host: "{{ EDXAPP_LMS_BASE }}"
    path: /heartbeat?extended
    json:
      - { path: modulestore.status, equals: true }
      - { path: sql.status, equals: true }
      - { path: celery.status, equals: true }
  - name: Studio heartbeat (MongoDB, MySQL and Celery)
    host: "{{ EDXAPP_CMS_BASE }}"
    path: /heartbeat?extended
    json:
      - { path: modulestore.status, equals: true }
      - { path: sql.status, equals: true }
      - { path: celery.status, equals: true }
  - name: Ecommerce health
    host: "ecommerce.{{ healthcheck_public_domain }}"
    path: /health/
    json:
      - { path: overall_status, equals: "OK" }
      - { path: detailed_status.database_status, equals: "OK" }
  - name: Marketing site NAU homepage
    host: "{{ marketing_site_nau_domain }}"
    path: /pt/
  - name: Marketing site NAU API
    host: "{{ marketing_site_nau_domain }}"
    path: /api/v1.0/courses/?limit=1
    content: '"objects"'
  - name: Marketing site AP homepage
    host: "ap.{{ healthcheck_public_domain }}"
    path: /pt/
  - name: Financial Manager admin redirects to the login
    host: "{{ financial_manager_nginx_server_name }}"
    path: /admin/
    status: 302
  - name: Partner API answers (request without credentials is refused)
    host: "{{ EDXAPP_LMS_BASE }}"
    path: /nau-openedx-extensions/partner-integration/auth-token/
    method: POST
    status: 400
    content: Missing client_id

# Names whose DNS answer must contain every IPv4 VIP of the load balancers.
healthcheck_dns_names:
  - "{{ EDXAPP_LMS_BASE }}"
  - "{{ EDXAPP_CMS_BASE }}"
  - "{{ marketing_site_nau_domain }}"

# ---------------------------------------------------------------------------
# Docker based services that are not in `makefile_healthcheck` (group_vars/all/monitoring.yml).
# That list is the gate of the deploy and rolling playbooks, so it must not grow.
# ---------------------------------------------------------------------------
healthcheck_balancer_make_dir: /nau/ops/nau-balancer
healthcheck_registry_mirror_make_dir: /nau/ops/docker_registry_mirror
